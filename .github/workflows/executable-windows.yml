# ---------------------------------------------------------------------------
# Fabrique l'installeur Windows (.exe) sur un runner GitHub.
#
# Raison d'etre : l'executable produit embarque son propre moteur Electron.
# Le poste qui l'installe n'a donc besoin NI de Node.js, NI de droits
# administrateur. Cette chaine permet de fabriquer cet executable sans avoir
# Node.js installe sur son propre PC : tout se passe sur la machine GitHub.
#
# Deux facons de la declencher :
#   - manuellement, onglet « Actions » du depot -> « Run workflow » ;
#   - en poussant une etiquette de version (« v1.0.0 »), ce qui publie en plus
#     les fichiers dans une Release, telechargeables d'un seul clic.
# ---------------------------------------------------------------------------

name: Executable Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  construire:
    name: Installeur et version portable
    runs-on: windows-latest
    timeout-minutes: 30

    # Necessaire a la seule etape de publication de Release ci-dessous.
    permissions:
      contents: write

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Verifier les types
        run: npm run typecheck

      - name: Compiler et empaqueter
        run: npm run dist

      - name: Lister ce qui a ete produit
        shell: bash
        run: ls -lh release/*.exe

      # Telechargeable depuis la page du workflow, onglet « Actions ».
      # GitHub distribue les artefacts dans une archive .zip : il faut donc
      # dezipper avant de lancer l'executable.
      - name: Deposer les executables
        uses: actions/upload-artifact@v4
        with:
          name: Olmix-Saisie-Production-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      # Sur une etiquette de version uniquement : les .exe sont attaches a une
      # Release, ou ils se telechargent directement, sans passer par un .zip.
      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
